name: Fork Docker image

# Builds the phpMyAdmin image of this fork (docker/Dockerfile) and publishes it
# to the GitHub Container Registry as ghcr.io/<owner>/phpmyadmin.

on:
  push:
    branches:
      - fork/docker
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    if: github.repository != 'phpmyadmin/phpmyadmin'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/phpmyadmin
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
